# Minimal PR-activity sync. The fleet-wide canonical workflow lives in the
# devops repo (repo-commons/.github/workflows/asana.yaml) — prefer that one.
#
# `edited` is deliberately absent: the CI-status mode patches the PR body
# itself, so subscribing to it would have the action re-trigger on its own
# edits and move tasks on every sandbox-block refresh.
on:
  pull_request:
    types:
      [
        opened,
        closed,
        reopened,
        ready_for_review,
        converted_to_draft,
        review_requested,
        review_request_removed,
      ]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review_comment:
    types: [created, edited, deleted]
  # The sweep: restates every open PR that links a task, catching whatever a
  # missed webhook or a run that died half-way left behind.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  sync-asana:
    runs-on: ubuntu-latest
    name: Sync PR state to Asana
    steps:
      - name: Sync
        uses: nsquared-team/asana-comment-on-task-github-action@main
        with:
          github-pat: ${{ secrets.OTTO_GITHUB_PAT }}
          asana-pat: ${{ secrets.OTTO_ASANA_PAT }}
