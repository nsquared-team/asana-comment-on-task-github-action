# Minimal PR-activity sync. The fleet-wide canonical workflow lives in the
# devops repo (repo-commons/.github/workflows/asana.yaml) — prefer that one.
on:
  pull_request:
    types:
      [
        opened,
        closed,
        reopened,
        ready_for_review,
        converted_to_draft,
        review_requested,
        edited,
      ]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review_comment:
    types: [created, edited, deleted]

jobs:
  sync-asana:
    runs-on: ubuntu-latest
    name: Sync PR state to Asana
    steps:
      - name: Sync
        uses: nsquared-team/asana-comment-on-task-github-action@main
        with:
          github-pat: ${{ secrets.OTTO_GITHUB_PAT }}
          asana-pat: ${{ secrets.OTTO_ASANA_PAT }}
