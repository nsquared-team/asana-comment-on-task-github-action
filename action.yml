name: 'Sync GitHub PR state to Asana'
description: 'Mirrors pull request activity onto the Asana tasks linked in the PR description: comments, followers, board sections, and review/CI approval subtasks.'
author: nsquared-team
branding:
  icon: circle
  color: green
inputs:
  action-url:
    description: 'URL of the CI run, linked from the "Automated CI Testing" approval subtask (used with CI-status invocations).'
    required: false
    default: ''
  github-pat:
    description: 'GitHub token. Reads the PR and its reviews on every event (review re-check and approval cascade), re-requests a reviewer whose review was dismissed, and edits the PR description (edit_pr_description mode).'
    required: true
    default: ''
  asana-pat:
    description: 'Asana personal access token used for all Asana API calls.'
    required: true
    default: ''
  asana-secret:
    description: 'Legacy input kept for workflow compatibility. Not used by this fork.'
    required: false
    default: ''
  comment-text:
    description: 'Mode switch. One of "approved" / "rejected" (CI verdict sync) or "edit_pr_description" (inject the CI sandbox block into the PR body). Any other value runs the default PR-activity sync.'
    required: false
    default: ''
  pr-description:
    description: 'Sandbox block content appended to the PR description in edit_pr_description mode.'
    required: false
    default: ''
outputs:
  event:
    description: 'The GitHub event name that was processed.'
  action:
    description: 'The event action that was processed.'
  comment:
    description: 'The comment HTML posted to Asana, if any.'
  commentStatus:
    description: 'HTTP status of the Asana comment call, if any.'
  commentBody:
    description: 'The formatted comment body, if any.'
runs:
  using: 'node20'
  main: 'dist/index.js'
